name: CI/CD for feat, develop and Master branches

on:
  push:
    branches:
      - '**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier
        run: npm run format -- --check

      - name: Run Tests
        run: npm test

  build-and-deploy:
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/Master' || github.ref == 'refs/heads/hotfix/#78-debug-cicd'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      
      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Print current branch
        run: |
          echo "Current branch: ${{ github.ref }}"
          echo "Expected branch (Master): refs/heads/Master"
      
      - name: Run tests
        run: npm test
      
      - name: Build project
        run: npm run build
        env:
          VITE_KAKAO_JS_KEY: ${{ secrets.VITE_KAKAO_JS_KEY }}
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2
      
      - name: Check Current S3 Content
        run: |
          echo "Current S3 content before deployment:"
          aws s3 ls s3://inplace.my/assets/ --recursive

      - name: Update CloudFront TTL Settings
        run: |
          # 현재 CloudFront 설정 가져오기
          aws cloudfront get-distribution-config --id ${{ secrets.CLOUDFRONT_ID }} --output json > distribution-config.json
          
          # ETag 저장
          ETAG=$(aws cloudfront get-distribution-config --id ${{ secrets.CLOUDFRONT_ID }} --query 'ETag' --output text)
          
          # 설정 파일 수정 (jq 사용)
          jq '.DistributionConfig.DefaultCacheBehavior.MinTTL = 0 | 
              .DistributionConfig.DefaultCacheBehavior.MaxTTL = 60 | 
              .DistributionConfig.DefaultCacheBehavior.DefaultTTL = 60' distribution-config.json > updated-config.json
          
          # 업데이트된 설정 적용
          aws cloudfront update-distribution --id ${{ secrets.CLOUDFRONT_ID }} \
            --distribution-config file://updated-config.json \
            --if-match $ETAG

      - name: Deploy to S3
        run: |
          if [ "${{ github.ref }}" == "refs/heads/develop" ] || [ "${{ github.ref }}" == "refs/heads/Master" ] || [ "${{ github.ref }}" == "refs/heads/hotfix/#78-debug-cicd" ]; then
            echo "Deploying to environment..."
            echo "Contents of dist directory:"
            ls -la dist/
            
            echo "Syncing with S3..."
            aws s3 sync dist/ s3://inplace.my --delete --metadata-directive REPLACE
            
            echo "Verifying S3 upload:"
            aws s3 ls s3://inplace.my/assets/ --recursive
          fi
            
      - name: Verify Deployment
        run: |
          echo "=== Deployment Verification ==="
          echo "1. Checking final S3 content:"
          aws s3 ls s3://inplace.my/assets/ --recursive
          
          echo "3. Checking specific JS file:"
          # dist 폴더에서 index-*.js 파일명 찾기
          JS_FILE=$(find dist/assets -name "index-*.js" -printf "%f\n")
          echo "Checking if $JS_FILE exists in S3:"
          aws s3 ls s3://inplace.my/assets/$JS_FILE
          
          echo "4. Deployment Summary:"
          echo "Branch: ${{ github.ref }}"
          echo "Last modified files in S3:"
          aws s3 ls s3://inplace.my --recursive --human-readable --summarize | tail -n 5