name: CI/CD for feat, develop and Master branches

on:
  push:
    branches:
      - '**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier
        run: npm run format -- --check

      - name: Run Tests
        run: npm test

  build-and-deploy:
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/Master' || github.ref == 'hotfix/#78-debug-cicd'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      
      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Print current branch
        run: |
          echo "Current branch: ${{ github.ref }}"
          echo "Expected branch (Master): refs/heads/Master"
      
      - name: Run tests
        run: npm test
      
      - name: Build project
        run: npm run build
        env:
          VITE_KAKAO_JS_KEY: ${{ secrets.VITE_KAKAO_JS_KEY }}
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2
      
      - name: Check Current CloudFront Invalidations
        run: |
          echo "Current CloudFront invalidations before deployment:"
          aws cloudfront list-invalidations --distribution-id ${{ secrets.CLOUDFRONT_ID }}
      
      - name: Check Current S3 Content
        run: |
          echo "Current S3 content before deployment:"
          aws s3 ls s3://inplace.my/assets/ --recursive

      - name: Deploy to S3 and Invalidate CloudFront
        run: |
          if [ "${{ github.ref }}" == "refs/heads/develop" ] || [ "${{ github.ref }}" == "refs/heads/Master" ] || [ "${{ github.ref }}" == "refs/heads/hotfix/#78-debug-cicd" ]; then
            echo "Deploying to environment..."
            echo "Contents of dist directory:"
            ls -la dist/
            
            echo "Syncing with S3..."
            aws s3 sync dist/ s3://inplace.my --delete

            echo "Verifying S3 upload:"
            aws s3 ls s3://inplace.my/assets/ --recursive
            
            echo "Creating CloudFront invalidation..."
            INVALIDATION_ID=$(aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_ID }} --paths "/*" --query 'Invalidation.Id' --output text)
            
            echo "Waiting for CloudFront invalidation to complete..."
            aws cloudfront wait invalidation-completed --distribution-id ${{ secrets.CLOUDFRONT_ID }} --id $INVALIDATION_ID
            
            echo "Verifying CloudFront invalidation status:"
            aws cloudfront get-invalidation --distribution-id ${{ secrets.CLOUDFRONT_ID }} --id $INVALIDATION_ID
          fi

      - name: Verify Deployment
        run: |
          echo "=== Deployment Verification ==="
          echo "1. Checking final S3 content:"
          aws s3 ls s3://inplace.my/assets/ --recursive
          
          echo "2. Checking final CloudFront invalidations:"
          aws cloudfront list-invalidations --distribution-id ${{ secrets.CLOUDFRONT_ID }}
          
          echo "3. Checking specific JS file:"
          # dist 폴더에서 index-*.js 파일명 찾기
          JS_FILE=$(find dist/assets -name "index-*.js" -printf "%f\n")
          echo "Checking if $JS_FILE exists in S3:"
          aws s3 ls s3://inplace.my/assets/$JS_FILE
          
          echo "4. Deployment Summary:"
          echo "Branch: ${{ github.ref }}"
          echo "Last modified files in S3:"
          aws s3 ls s3://inplace.my --recursive --human-readable --summarize | tail -n 5